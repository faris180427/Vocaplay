<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" fill="none">
  <defs>
    <linearGradient id="vp-lockup-grad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Container (Left) -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#0F172A" stroke="#1E293B" stroke-width="2.5"/>
    <!-- V Chevron -->
    <path d="M34 40 L52 40 L64 74 L76 40 L94 40 L70 96 Q64 100 58 96 Z" fill="url(#vp-lockup-grad)"/>
    <!-- Inset Play Triangle -->
    <path d="M58 52 L73 62 L58 72 Z" fill="#F8FAFC"/>
    <!-- Sound Spark Accent -->
    <circle cx="94" cy="34" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(170, 0)">
    <!-- Brand Wordmark "Vocaplay" -->
    <text x="0" y="86" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#F8FAFC" letter-spacing="-0.03em">
      Voca<tspan fill="#38BDF8">play</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="118" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="0.18em">
      ENGLISH LANGUAGE STUDIO
    </text>

    <!-- CEFR Metric Badge -->
    <rect x="290" y="103" width="76" height="20" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="328" y="117" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="10" fill="#38BDF8">
      CEFR A1-C1
    </text>
  </g>
</svg>
